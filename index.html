<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09121d">
  <title>SpelGPS – första prototypen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #09121d;
      --panel: rgba(8, 19, 31, .93);
      --accent: #5cf6e5;
      --accent-strong: #1cc4b9;
      --text: #ebfaf9;
      --muted: #9bb2bf;
      --border: rgba(92,246,229,.28);
      --tile-filter: grayscale(1) invert(1) hue-rotate(160deg) brightness(.68) contrast(1.23);
    }
    body[data-theme="retro"] {
      --bg: #19170d; --panel: rgba(31, 30, 18, .94);
      --accent: #f0ce73; --accent-strong: #b48c36;
      --text: #fff5d6; --muted: #c0b08e;
      --border: rgba(240,206,115,.30);
      --tile-filter: grayscale(1) sepia(.5) invert(.85) hue-rotate(178deg) brightness(.70) contrast(1.12);
    }
    body[data-theme="tactical"] {
      --bg: #0a170f; --panel: rgba(10,25,14,.94);
      --accent: #94ef88; --accent-strong: #499b4f;
      --text: #efffeb; --muted: #a7c6a5;
      --border: rgba(148,239,136,.28);
      --tile-filter: grayscale(1) invert(.94) sepia(.45) hue-rotate(54deg) brightness(.60) contrast(1.22);
    }
    html, body, #map { margin: 0; width: 100%; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
    #map { position: fixed; inset: 0; }
    .leaflet-tile-pane { filter: var(--tile-filter); }
    .leaflet-container { background: var(--bg); }
    .leaflet-control-attribution { background: rgba(8,19,31,.88) !important; color:#d9e6e2; border-radius: 6px; padding: 3px 5px !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: #b6efff !important; }
    .leaflet-top.leaflet-right { top: 92px; right: 5px; }
    .leaflet-control-zoom a { background: var(--panel) !important; color: var(--accent) !important; border-color: var(--border) !important; }
    .leaflet-control-zoom { border: 1px solid var(--border) !important; }
    .topbar {
      position: fixed; z-index: 1100; top: calc(env(safe-area-inset-top) + 10px); left: 12px; right: 12px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      pointer-events: none;
    }
    .hud, .theme-wrap, .panel { background: var(--panel); border: 1px solid var(--border); box-shadow: 0 12px 38px rgba(0,0,0,.33); backdrop-filter: blur(10px); }
    .hud { border-radius: 14px; padding: 12px 14px; max-width: min(67vw, 320px); }
    .hud .eyebrow { font-size: 10px; letter-spacing: .18em; font-weight: 800; color: var(--accent); }
    .hud h1 { margin: 3px 0 5px; font-size: clamp(17px, 3.5vw, 23px); letter-spacing: .04em; }
    .hud .small { font-size: 11px; color: var(--muted); line-height: 1.35; }
    .theme-wrap { border-radius: 12px; padding: 9px 10px; font-size: 11px; pointer-events: auto; flex-shrink: 0; }
    .theme-wrap label { display: block; color: var(--muted); margin-bottom: 5px; }
    select { display: block; background: transparent; color: var(--text); border: 0; outline-color: var(--accent); max-width: 118px; font-size: 13px; font-weight: 750; }
    select option { background: #172331; }
    .panel {
      position: fixed; z-index: 1100; left: 12px; right: 12px;
      bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 560px; margin-inline: auto;
      padding: 15px; border-radius: 18px;
    }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .label { font-size: 10px; color: var(--accent); letter-spacing: .17em; font-weight: 800; }
    #gpsBadge { font-size: 10px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 40px; color: var(--accent); white-space: nowrap; }
    #message { color: var(--text); font-size: 13px; line-height: 1.4; min-height: 35px; margin: 12px 0 10px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 12px; }
    .stat { background: rgba(255,255,255,.035); border: 1px solid var(--border); border-radius: 11px; padding: 9px 12px; }
    .stat span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .08em; margin-bottom: 2px; }
    .stat strong { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    .buttons { display: flex; gap: 8px; }
    button { font-family: inherit; font-weight: 800; cursor: pointer; border: 1px solid var(--border); border-radius: 11px; min-height: 46px; padding: 10px; }
    .primary { background: var(--accent); color: #071219; flex: 1; }
    .secondary { background: rgba(255,255,255,.06); color: var(--text); flex: 1; }
    button:disabled { opacity: .48; cursor: not-allowed; }
    .bottomline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-top: 10px; }
    .bottomline small { color: var(--muted); font-size: 10px; }
    .textbutton { background: none; border: 0; min-height: 26px; padding: 2px; color: var(--accent); font-size: 11px; }
    .player-arrow { width: 31px; height: 31px; background: var(--accent); color: #09121d; border: 3px solid #fff; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 7px rgba(92,246,229,.18), 0 2px 15px #0009; font-weight: 900; line-height: 1; }
    .goal-dot { width: 22px; height: 22px; background: #ff7f75; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 0 0 5px rgba(255,127,117,.2); }
    .leaflet-div-icon { background: none; border: none; }
    .leaflet-container .leaflet-popup-content-wrapper { color: var(--text); background: var(--panel); }
    .leaflet-container .leaflet-popup-tip { background: var(--panel); }
    @media (max-width: 380px) { .theme-wrap { padding: 8px 7px; } .hud { padding: 10px; } .panel { padding: 12px; } .buttons button { font-size: 12px; } }
  </style>
</head>
<body data-theme="neon">
  <div id="map" aria-label="Interaktiv karta"></div>
  <div class="topbar">
    <div class="hud">
      <div class="eyebrow">LEVEL 01 / PROTOTYP</div>
      <h1>◈ SpelGPS</h1>
      <div class="small">En riktig karta med spelkänsla</div>
    </div>
    <div class="theme-wrap">
      <label for="theme">KARTTEMA</label>
      <select id="theme" aria-label="Välj karttema">
        <option value="neon">Neon</option>
        <option value="retro">Retro</option>
        <option value="tactical">Taktisk</option>
      </select>
    </div>
  </div>
  <section class="panel" aria-label="GPS-kontroller">
    <div class="line"><div class="label">NAVIGATION / ROUTE</div><span id="gpsBadge">GPS AV</span></div>
    <p id="message" role="status" aria-live="polite">Tryck på ”Starta GPS” och tillåt platsåtkomst. Tryck sedan på en plats på kartan för att välja mål.</p>
    <div class="stats">
      <div class="stat"><span>STRÄCKA</span><strong id="distance">—</strong></div>
      <div class="stat"><span>BERÄKNAD KÖRTID</span><strong id="duration">—</strong></div>
    </div>
    <div class="buttons">
      <button class="primary" id="gpsButton">◎ Starta GPS</button>
      <button class="secondary" id="routeButton" disabled>↻ Räkna rutt</button>
    </div>
    <div class="bottomline"><button class="textbutton" id="demoButton">Testa med demoposition i Stockholm</button><small>Testprototyp • Ej för säker bilnavigering</small></div>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    'use strict';
    // 1) Skapa kartan. Stockholm visas tills vi får en GPS-position.
    const map = L.map('map', { zoomControl: false }).setView([59.3293, 18.0686], 15);
    // Visa källan på kartan (krävs enligt OpenStreetMaps villkor).
    map.attributionControl.setPosition('topright');
    map.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      minZoom: 3, maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsgivare'
    }).addTo(map);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const message = document.getElementById('message');
    const badge = document.getElementById('gpsBadge');
    const gpsButton = document.getElementById('gpsButton');
    const routeButton = document.getElementById('routeButton');
    const demoButton = document.getElementById('demoButton');
    const distance = document.getElementById('distance');
    const duration = document.getElementById('duration');

    let myPosition = null;
    let destination = null;
    let player = null;
    let accuracyCircle = null;
    let goalMarker = null;
    let routeLine = null;
    let watchId = null;
    let isDemo = false;
    let requestId = 0;

    document.getElementById('theme').addEventListener('change', (event) => {
      document.body.dataset.theme = event.target.value;
    });

    // 2) Uppdatera kartan när telefonens GPS skickar en ny position.
    function showPosition(lat, lon, accuracy) {
      myPosition = [lat, lon];
      if (!player) {
        const icon = L.divIcon({ html: '<div class="player-arrow">▲</div>', iconSize: [31, 31], iconAnchor: [15, 15] });
        player = L.marker(myPosition, { icon, zIndexOffset: 1000 }).addTo(map).bindPopup('Din position');
      } else {
        player.setLatLng(myPosition);
      }
      if (Number.isFinite(accuracy)) {
        if (!accuracyCircle) {
          accuracyCircle = L.circle(myPosition, {radius: accuracy, color: '#5cf6e5', weight: 1, fillOpacity: .07, interactive: false}).addTo(map);
        } else {
          accuracyCircle.setLatLng(myPosition).setRadius(accuracy);
        }
      } else if (accuracyCircle) {
        map.removeLayer(accuracyCircle);
        accuracyCircle = null;
      }
      badge.textContent = isDemo ? 'DEMOLÄGE' : `GPS ±${Math.round(accuracy || 0)} m`;
      routeButton.disabled = destination === null;
    }

    gpsButton.addEventListener('click', () => {
      if (!navigator.geolocation) {
        message.textContent = 'Den här webbläsaren stöder inte GPS-positionering.';
        return;
      }
      if (!window.isSecureContext) {
        message.textContent = 'GPS kräver en säker HTTPS-adress. Lägg upp filen på GitHub Pages först.';
        return;
      }
      if (watchId !== null) {
        if (myPosition) map.setView(myPosition, 16);
        return;
      }
      message.textContent = 'Söker efter din GPS-position…';
      gpsButton.textContent = '◎ Visa min position';
      // watchPosition följer telefonens position så länge sidan är aktiv.
      watchId = navigator.geolocation.watchPosition(
        ({coords}) => {
          const firstFix = myPosition === null || isDemo;
          isDemo = false;
          showPosition(coords.latitude, coords.longitude, coords.accuracy);
          if (firstFix) {
            map.setView(myPosition, 16);
            message.textContent = destination ? 'GPS aktiv. Uppdatera rutten med ”Räkna rutt”.' : 'GPS aktiv! Tryck på kartan där du vill köra.';
          }
        },
        (error) => {
          badge.textContent = 'GPS-FEL';
          message.textContent = error.code === 1
            ? 'Platsåtkomst nekades. Tillåt platsåtkomst för sidan i webbläsarens inställningar.'
            : 'Kan inte läsa GPS just nu. Försök igen utomhus med platsåtkomst aktiverad.';
          if (watchId !== null) navigator.geolocation.clearWatch(watchId);
          watchId = null;
          gpsButton.textContent = '◎ Starta GPS';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    });

    // Demoläge: bra för att testa rutten från en dator, utan GPS.
    demoButton.addEventListener('click', () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      gpsButton.textContent = '◎ Starta GPS';
      isDemo = true;
      showPosition(59.3275, 18.0540, null); // Stockholm, exempelposition
      map.setView(myPosition, 14);
      message.textContent = 'Demoläge! Tryck på en plats på kartan för att se en bilrutt från exempelpositionen.';
    });

    // 3) Välj destination genom att klicka/trycka på kartan.
    map.on('click', (event) => {
      destination = event.latlng;
      if (!goalMarker) {
        const icon = L.divIcon({ html: '<div class="goal-dot"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
        goalMarker = L.marker(destination, { icon }).addTo(map).bindPopup('Ditt mål');
      } else {
        goalMarker.setLatLng(destination);
      }
      if (!myPosition) {
        message.textContent = 'Målet är markerat. Starta GPS eller välj demoläge för att få en bilrutt.';
        return;
      }
      calculateRoute();
    });

    // 4) Be OSRM om en bilrutt mellan GPS och den valda platsen.
    async function calculateRoute() {
      if (!myPosition || !destination) return;
      const id = ++requestId;
      const start = `${myPosition[1]},${myPosition[0]}`; // OSRM vill ha longitud,latitud
      const end = `${destination.lng},${destination.lat}`;
      const url = `https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson`;
      routeButton.disabled = true;
      message.textContent = 'Räknar ut en körväg…';
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Svar från ruttjänsten saknas');
        const data = await response.json();
        if (id !== requestId) return;
        if (data.code !== 'Ok' || !data.routes?.length) throw new Error('Ingen bilväg hittades');
        const route = data.routes[0];
        const coordinates = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline(coordinates, { color: getComputedStyle(document.body).getPropertyValue('--accent').trim(), weight: 6, opacity: .9 }).addTo(map);
        const km = route.distance / 1000;
        distance.textContent = km < 10 ? `${km.toFixed(1).replace('.', ',')} km` : `${Math.round(km)} km`;
        const minutes = Math.max(1, Math.round(route.duration / 60));
        duration.textContent = minutes < 60 ? `${minutes} min` : `${Math.floor(minutes / 60)} h ${minutes % 60} m`;
        message.textContent = 'Rutten visas! Din position uppdateras med GPS, men rutten räknas om först när du trycker ”Räkna rutt”.';
        map.fitBounds(routeLine.getBounds(), {paddingTopLeft: [35, 150], paddingBottomRight: [35, 295], maxZoom: 16});
      } catch (error) {
        if (id !== requestId) return;
        message.textContent = `Kunde inte räkna rutten (${error.message}). Försök igen eller välj en annan plats.`;
      } finally {
        if (id === requestId) routeButton.disabled = false;
      }
    }
    routeButton.addEventListener('click', calculateRoute);
    // Håll ruttfärgen i synk när man byter tema.
    document.getElementById('theme').addEventListener('change', () => {
      if (routeLine) routeLine.setStyle({color: getComputedStyle(document.body).getPropertyValue('--accent').trim()});
    });
  </script>
</body>
</html>
